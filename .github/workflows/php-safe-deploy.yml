# ─────────────────────────────────────────────────────────────────────────────
# ADWire — 安全 PHP 部署（上傳 → php -l → 通過才安裝）
#
# 為何需要：
#   send-mail.php 一旦有 syntax error，整站聯絡表單會回 500（影響真實生意）。
#   本機冇 PHP，所以借 runner 的 SSH 做兩段式部署。
#
# 設計要點（實戰教訓）：
#   ① 每次 SSH 連線都有成本，SiteGround 對頻繁連線不穩定 → lint 與安裝
#      合併成「一次」SSH，遠端腳本用 heredoc（bash -s）餵入，避免嵌套引號。
#   ② 輸入路徑係 webroot 相對路徑，本機檔案在 public/<path>。
#
# 用法：Actions → PHP Safe Deploy → Run workflow
# ─────────────────────────────────────────────────────────────────────────────

name: PHP Safe Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      files:
        description: '要部署的檔案（webroot 相對路徑，空格分隔）'
        required: true
        default: 'send-mail.php'
      install:
        description: '檢查通過後是否放入正式位置'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SITEGROUND_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo '✅ SSH 密鑰已寫入'

      - name: Upload files to staging
        env:
          SG_HOST: ${{ secrets.SITEGROUND_HOST }}
          SG_USER: ${{ secrets.SITEGROUND_USER }}
          FILES: ${{ github.event.inputs.files }}
        run: |
          set -euo pipefail
          SCP="scp -i ~/.ssh/deploy_key -P 18765 -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
          SSH="ssh -i ~/.ssh/deploy_key -p 18765 -o BatchMode=yes -o StrictHostKeyChecking=accept-new ${SG_USER}@${SG_HOST}"
          RHOME=$($SSH 'echo $HOME' | tr -d '\r' | tail -1)
          STAGE="$RHOME/php-staging-$(date +%Y%m%d-%H%M%S)"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          $SSH "mkdir -p '$STAGE'"
          for f in $FILES; do
            LOCAL="public/$f"
            [ -f "$LOCAL" ] || { echo "::error::本機找不到 $LOCAL"; exit 1; }
            $SCP "$LOCAL" "${SG_USER}@${SG_HOST}:$STAGE/$(basename "$f")"
            echo "  ↑ $LOCAL"
          done
          echo "✅ 已上傳到暫存目錄：$STAGE"

      - name: Lint + install (single SSH session)
        env:
          SG_HOST: ${{ secrets.SITEGROUND_HOST }}
          SG_USER: ${{ secrets.SITEGROUND_USER }}
          SG_PATH: ${{ secrets.SITEGROUND_PATH }}
          FILES: ${{ github.event.inputs.files }}
          INSTALL: ${{ github.event.inputs.install }}
        run: |
          set -uo pipefail
          ssh -i ~/.ssh/deploy_key -p 18765 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${SG_USER}@${SG_HOST}" bash -s <<REMOTE
          set -u
          STAGE="${STAGE}"
          WEB="${SG_PATH}"
          INSTALL="${INSTALL}"
          FILES="${FILES}"
          FAIL=0
          echo "===== php -l 檢查 ====="
          for f in \$FILES; do
            b=\$(basename "\$f")
            case "\$b" in
              *.php)
                echo "--- \$b"
                php -l "\$STAGE/\$b" 2>&1 || FAIL=1
                ;;
              *)
                echo "--- \$b（非 PHP，略過）"
                ;;
            esac
          done
          if [ "\$FAIL" != "0" ]; then
            echo "::RESULT::LINT_FAILED"
            rm -rf "\$STAGE"
            exit 0
          fi
          echo "::RESULT::LINT_OK"
          if [ "\$INSTALL" != "true" ]; then
            echo "（install=false：只檢查，不安裝）"
            rm -rf "\$STAGE"
            exit 0
          fi
          echo "===== 安裝到正式位置 ====="
          for f in \$FILES; do
            b=\$(basename "\$f")
            d=\$(dirname "\$f"); [ "\$d" = "." ] && d=""
            mkdir -p "\$WEB/\$d"
            cp -f "\$STAGE/\$b" "\$WEB/\$f"
            ls -la "\$WEB/\$f"
          done
          echo "===== 部署後驗證 ====="
          ls -la "\$WEB/send-mail.php"
          ls -la "\$WEB/downloads/" 2>/dev/null | head -12 || true
          rm -rf "\$STAGE"
          echo "✅ 完成"
          REMOTE
