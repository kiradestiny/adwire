name: Live Probe (manual)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'space-separated URLs'
        required: true
        default: 'https://adwire.com.hk/blog/seo-vs-geo/'
      grep:
        description: 'optional: space-separated strings to count in the body'
        required: false
        default: ''
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Curl titles + redirects
        run: |
          for u in ${{ github.event.inputs.urls }}; do
            echo "===== $u"
            curl -s -o /dev/null -w 'status=%{http_code} redirect=%{redirect_url} final=%{url_effective}\n' -L --max-time 30 "$u"
            curl -sL --max-time 30 "$u" | grep -o '<title>[^<]*</title>' | head -1
            for kw in ${{ github.event.inputs.grep }}; do
              n=$(curl -sL --max-time 30 "$u" | grep -o "$kw" | wc -l)
              echo "  grep '$kw' = $n"
            done
          done