# ─────────────────────────────────────────────────────────────────────────────
# ADWire Website — GitHub Actions 自動部署工作流
# ─────────────────────────────────────────────────────────────────────────────
# 觸發條件：
#   1. Push 到 main 分支（程式碼更新）
#   2. Repository Dispatch 事件（後台「發佈更新」按鈕觸發）
#
# 需要在 GitHub Repo → Settings → Secrets and variables → Actions 中設定：
#   - SITEGROUND_HOST      : SiteGround SSH 主機位址
#   - SITEGROUND_USER      : SiteGround SSH 使用者名稱
#   - SITEGROUND_SSH_KEY   : SiteGround SSH 私鑰（完整內容）
#   - SITEGROUND_PATH      : 網站根目錄的絕對路徑（例如 /home/user/domains/adwire.com.hk/public_html）
#   - NEXT_PUBLIC_API_URL  : Admin API 基礎 URL（例如 https://adwire.com.hk/admin/api）
#   - ADMIN_API_KEY        : Admin API 認證 Key
# ─────────────────────────────────────────────────────────────────────────────

name: Build & Deploy to SiteGround

on:
  # 1. 程式碼推送到 main 分支時自動構建
  push:
    branches: [main]
    paths:
      # 只有這些目錄變更才觸發，避免不必要的構建
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tailwind.config.ts'
      - 'tsconfig.json'
      - 'postcss.config.mjs'

  # 2. 後台「發佈更新」按鈕觸發（透過 GitHub API 發送 repository_dispatch）
  repository_dispatch:
    types: [rebuild]

  # 3. 允許手動觸發
  workflow_dispatch:

# 避免同時多個部署衝突
concurrency:
  group: deploy-production
  cancel-in-progress: false  # 不取消正在進行的部署，排隊執行

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout 程式碼 ──
      - name: Checkout code
        uses: actions/checkout@v5

      # ── 2. 設定 Node.js ──
      #    用 Node 24（現行 LTS）。原本用 Node 20，但 Node 20 已於 2026-04 EOL，
      #    而且 v4 actions 嘅 Node 20 runtime 已於 2026-09-16 從 runner 移除。
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # ── 3. 安裝依賴 ──
      - name: Install dependencies
        run: npm ci

      # ── 4. Build Next.js 靜態網站 ──
      #    環境變數在 Build Time 注入，用於從 Admin API 拉取最新數據
      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: npm run build

      # ── 5. 驗證構建產物 ──
      - name: Verify build output
        run: |
          if [ ! -d "out" ]; then
            echo "❌ Build failed: 'out' directory not found"
            exit 1
          fi
          echo "✅ Build output verified"
          echo "📊 Total files: $(find out -type f | wc -l)"
          echo "📊 Total size: $(du -sh out | cut -f1)"

      # ── 6. 部署前防護：備份 .htaccess + 健康基準 ──
      #    為什麼需要這一步：
      #      .htaccess 一旦語法錯誤，Apache 會對「全站」回傳 HTTP 500，是唯一
      #      可以一次過令整個網站下線的檔案。
      #      2026-09 之前這個檔案被 rsync --exclude 排除，導致 repo 內的改動
      #      （例如新增 301 重定向）靜默地永遠不會生效 —— 規則語法正確、
      #      部署顯示成功、但舊網址繼續 404。現在改為可部署，並加上
      #      「備份 → 部署 → 驗證 → 失敗自動回滾」防護。
      # 注意：不可在此使用 webfactory/ssh-agent。
      #   它會輸出 SSH_AUTH_SOCK／SSH_AGENT_PID，而 burnett01/rsync-deployments
      #   以 Docker 容器執行並繼承這些環境變數 —— 容器內沒有該 socket，
      #   於是 ssh-add 失敗並回報 "Error connecting to agent: No such file or directory"，
      #   令整個 rsync 部署步驟失敗（2026-09 實測）。改用檔案式密鑰最簡單可靠。
      - name: Prepare SSH key file
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SITEGROUND_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo '✅ SSH 密鑰已寫入 ~/.ssh/deploy_key'

      - name: Pre-flight — back up .htaccess and capture health baseline
        id: preflight
        env:
          SG_HOST: ${{ secrets.SITEGROUND_HOST }}
          SG_USER: ${{ secrets.SITEGROUND_USER }}
          SG_PATH: ${{ secrets.SITEGROUND_PATH }}
        run: |
          # 注意：裸 "Mozilla/5.0" 會被 SiteGround WAF 回 403，必須用完整瀏覽器 UA
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36'

          BASE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 -A "$UA" https://adwire.com.hk/ || echo 000)
          echo "baseline=$BASE" >> "$GITHUB_OUTPUT"
          echo "部署前基準（首頁）: $BASE（200/202 = 正常；5xx/000 = 異常）"

          # 本機 .htaccess 語法自檢：IfModule 開合必須平衡
          OPEN=$(grep -c '<IfModule' out/.htaccess || true)
          CLOSE=$(grep -c '</IfModule>' out/.htaccess || true)
          echo "out/.htaccess：IfModule 開=$OPEN 合=$CLOSE"
          if [ "$OPEN" != "$CLOSE" ]; then
            echo "::error::out/.htaccess 的 IfModule 標籤不平衡，中止部署以免全站 500"
            exit 1
          fi

          # 備份正式站 .htaccess（回滾點）。
          # 必須放在 webroot 之外：放在 $SG_PATH 內會變成可被下載的檔案。
          # 取得「遠端」家目錄。
          # 不可以用本地 $HOME：那會展開成 runner 的路徑（/home/runner），
          # 實測導致 cp 失敗：cannot create regular file '/home/runner/...'。
          RHOME=$(ssh -i ~/.ssh/deploy_key -p 18765 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${SG_USER}@${SG_HOST}" 'echo $HOME' 2>/dev/null | tr -d '\r' | tail -1)
          echo "遠端家目錄: $RHOME"
          BK="$RHOME/htaccess_backup-$(date +%Y%m%d-%H%M%S)"
          ssh -i ~/.ssh/deploy_key -p 18765 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${SG_USER}@${SG_HOST}" \
            "cp '$SG_PATH/.htaccess' '$BK' && ls -l '$BK'"
          echo "backup=$BK" >> "$GITHUB_OUTPUT"
          echo "已備份 .htaccess → $BK"

      # ── 7. 部署到 SiteGround ──
      #    使用 rsync over SSH，只傳輸變更的檔案
      - name: Deploy to SiteGround via rsync
        uses: burnett01/rsync-deployments@v9
        with:
          # 排除清單（每一項都係「唔可以由 build 產物覆蓋」嘅東西）：
          #   .well-known              → SSL/ACME 驗證 + 電郵自動設定 (Outlook/iOS) — 絕對不可刪
          #   crm/                     → ADWire CRM 獨立應用（166 檔案）
          #   .htaccess                → 2026-09 起改為【由 build 產物部署】（原本被排除，導致
          #                              repo 內的 301／重寫規則改動靜默地永不生效）。
          #                              已加上部署前備份、IfModule 平衡自檢及部署後
          #                              健康檢查 + 失敗自動回滾（見步驟 6 及 8）。
          #   send-mail.php            → 現由 build 產物部署（repo 版為改良版：讀 config.php、
          #                              用 config/services.json 白名單、DB 式速率限制，
          #                              並將 enquiry 寫入資料庫供後台查看）
          #   admin/includes/config.php→ 後台實際憑證（DB/API key），只在伺服器上存在，
          #                              必須排除【上傳同刪除】，否則每次部署都會清走
          # 註：admin/ 其餘檔案由 build 產物部署（PHP 後台程式碼，repo 內有 28 個檔案）。
          #     blog/ portfolio/ services/ system/ video/ 原本被排除，但經核對後
          #     伺服器與 build 產物檔案集完全相同，排除只會令頁面改動無法發佈，故已移除。
          switches: -avzr --delete --exclude='.well-known' --exclude='crm' --exclude='admin/includes/config.php'
          path: out/
          remote_path: ${{ secrets.SITEGROUND_PATH }}/
          remote_host: ${{ secrets.SITEGROUND_HOST }}
          remote_user: ${{ secrets.SITEGROUND_USER }}
          remote_key: ${{ secrets.SITEGROUND_SSH_KEY }}
          # SiteGround 的 SSH 埠係 18765（唔係預設 22，22 係封閉嘅）
          # burnett01/rsync-deployments 預設 remote_port=22，唔指定就會 timeout
          remote_port: 18765

      # ── 8. 部署後驗證 + 失敗自動回滾 ──
      #    只在「部署前基準為 200 而部署後非 200」時回滾，避免 WAF 的 403
      #    造成假警報（裸 Mozilla/5.0 會被 SiteGround WAF 攔，實測過）。
      - name: Verify production and roll back .htaccess on failure
        env:
          SG_HOST: ${{ secrets.SITEGROUND_HOST }}
          SG_USER: ${{ secrets.SITEGROUND_USER }}
          SG_PATH: ${{ secrets.SITEGROUND_PATH }}
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36'
          FAIL=0
          # 判定標準：只有 5xx（.htaccess 語法錯誤的徵狀）及連線失敗（000）
          # 才算故障。SiteGround WAF 對非瀏覽器來源會回 HTTP 202 挑戰頁，
          # 202 代表伺服器正常運作 —— 曾誤判為失敗，故明確排除。
          for p in / /contact/ /services/ /services/web/ /blog/ /privacy/ /portfolio/; do
            C=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 -A "$UA" "https://adwire.com.hk$p" || echo 000)
            printf '  %-18s %s\n' "$p" "$C"
            case "$C" in
              5*|000) FAIL=1 ;;
            esac
          done

          # 若本次 build 帶有 legacy 301 規則，順便驗證重定向是否真的生效
          if grep -q 'kol推廣' out/.htaccess; then
            LOC=$(curl -sS -o /dev/null -D - --max-time 25 -A "$UA" 'https://adwire.com.hk/short-video-marketing/' \
                  | grep -i '^location:' | tr -d '\r' | awk '{print $2}')
            echo "  301 檢查: /short-video-marketing/ -> $LOC"
            case "$LOC" in
              */services/video/) echo "  ✅ 301 生效" ;;
              *) echo "  ️ 301 未如預期（可能係 CDN 快取，稍後再確認）" ;;
            esac
          fi

          BASE='${{ steps.preflight.outputs.baseline }}'
          case "$BASE" in 5*|000) BASE_BAD=1 ;; *) BASE_BAD=0 ;; esac
          if [ "$FAIL" = "1" ] && [ "$BASE_BAD" = "0" ]; then
            echo "::error::部署後有頁面 5xx／連線失敗，而部署前基準正常 → 回滾 .htaccess"
            ssh -i ~/.ssh/deploy_key -p 18765 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              "${SG_USER}@${SG_HOST}" \
              "cp '${{ steps.preflight.outputs.backup }}' '$SG_PATH/.htaccess' && echo ROLLED_BACK"
            sleep 3
            echo "回滾後首頁: $(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 -A "$UA" https://adwire.com.hk/)"
            exit 1
          fi
          if [ "$FAIL" = "1" ]; then
            echo "::warning::部署後有頁面 5xx 或連線失敗，但部署前基準同樣異常（可能是 WAF 攔截而非網站故障），未回滾"
            exit 1
          fi
          echo "✅ 部署後驗證通過"

      # ── 9. 部署完成通知 ─
      - name: Deployment summary
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "📅 Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🔗 URL: https://adwire.com.hk"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "📌 Triggered by: Admin Panel「發佈更新」"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "📌 Triggered by: Git push to main"
          else
            echo "📌 Triggered by: Manual workflow dispatch"
          fi
