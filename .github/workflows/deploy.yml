# ─────────────────────────────────────────────────────────────────────────────
# ADWire Website — GitHub Actions 自動部署工作流
# ─────────────────────────────────────────────────────────────────────────────
# 觸發條件：
#   1. Push 到 main 分支（程式碼更新）
#   2. Repository Dispatch 事件（後台「發佈更新」按鈕觸發）
#
# 需要在 GitHub Repo → Settings → Secrets and variables → Actions 中設定：
#   - SITEGROUND_HOST      : SiteGround SSH 主機位址
#   - SITEGROUND_USER      : SiteGround SSH 使用者名稱
#   - SITEGROUND_SSH_KEY   : SiteGround SSH 私鑰（完整內容）
#   - SITEGROUND_PATH      : 網站根目錄的絕對路徑（例如 /home/user/domains/adwire.com.hk/public_html）
#   - NEXT_PUBLIC_API_URL  : Admin API 基礎 URL（例如 https://adwire.com.hk/admin/api）
#   - ADMIN_API_KEY        : Admin API 認證 Key
# ─────────────────────────────────────────────────────────────────────────────

name: Build & Deploy to SiteGround

on:
  # 1. 程式碼推送到 main 分支時自動構建
  push:
    branches: [main]
    paths:
      # 只有這些目錄變更才觸發，避免不必要的構建
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tailwind.config.ts'
      - 'tsconfig.json'
      - 'postcss.config.mjs'

  # 2. 後台「發佈更新」按鈕觸發（透過 GitHub API 發送 repository_dispatch）
  repository_dispatch:
    types: [rebuild]

  # 3. 允許手動觸發
  workflow_dispatch:

# 避免同時多個部署衝突
concurrency:
  group: deploy-production
  cancel-in-progress: false  # 不取消正在進行的部署，排隊執行

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout 程式碼 ──
      - name: Checkout code
        uses: actions/checkout@v5

      # ── 2. 設定 Node.js ──
      #    用 Node 24（現行 LTS）。原本用 Node 20，但 Node 20 已於 2026-04 EOL，
      #    而且 v4 actions 嘅 Node 20 runtime 已於 2026-09-16 從 runner 移除。
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # ── 3. 安裝依賴 ──
      - name: Install dependencies
        run: npm ci

      # ── 4. Build Next.js 靜態網站 ──
      #    環境變數在 Build Time 注入，用於從 Admin API 拉取最新數據
      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: npm run build

      # ── 5. 驗證構建產物 ──
      - name: Verify build output
        run: |
          if [ ! -d "out" ]; then
            echo "❌ Build failed: 'out' directory not found"
            exit 1
          fi
          echo "✅ Build output verified"
          echo "📊 Total files: $(find out -type f | wc -l)"
          echo "📊 Total size: $(du -sh out | cut -f1)"

      # ── 6. 部署到 SiteGround ──
      #    使用 rsync over SSH，只傳輸變更的檔案
      - name: Deploy to SiteGround via rsync
        uses: burnett01/rsync-deployments@v9
        with:
          # 排除清單（每一項都係「唔可以由 build 產物覆蓋」嘅東西）：
          #   .well-known              → SSL/ACME 驗證 + 電郵自動設定 (Outlook/iOS) — 絕對不可刪
          #   crm/                     → ADWire CRM 獨立應用（166 檔案）
          #   .htaccess                → 伺服器安全標頭 / 重寫規則（HSTS、CSP 等）
          #   send-mail.php            → 現由 build 產物部署（repo 版為改良版：讀 config.php、
          #                              用 config/services.json 白名單、DB 式速率限制，
          #                              並將 enquiry 寫入資料庫供後台查看）
          #   admin/includes/config.php→ 後台實際憑證（DB/API key），只在伺服器上存在，
          #                              必須排除【上傳同刪除】，否則每次部署都會清走
          # 註：admin/ 其餘檔案由 build 產物部署（PHP 後台程式碼，repo 內有 28 個檔案）。
          #     blog/ portfolio/ services/ system/ video/ 原本被排除，但經核對後
          #     伺服器與 build 產物檔案集完全相同，排除只會令頁面改動無法發佈，故已移除。
          switches: -avzr --delete --exclude='.well-known' --exclude='crm' --exclude='.htaccess' --exclude='admin/includes/config.php'
          path: out/
          remote_path: ${{ secrets.SITEGROUND_PATH }}/
          remote_host: ${{ secrets.SITEGROUND_HOST }}
          remote_user: ${{ secrets.SITEGROUND_USER }}
          remote_key: ${{ secrets.SITEGROUND_SSH_KEY }}
          # SiteGround 的 SSH 埠係 18765（唔係預設 22，22 係封閉嘅）
          # burnett01/rsync-deployments 預設 remote_port=22，唔指定就會 timeout
          remote_port: 18765

      # ── 7. 部署完成通知 ──
      - name: Deployment summary
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "📅 Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🔗 URL: https://adwire.com.hk"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "📌 Triggered by: Admin Panel「發佈更新」"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "📌 Triggered by: Git push to main"
          else
            echo "📌 Triggered by: Manual workflow dispatch"
          fi
